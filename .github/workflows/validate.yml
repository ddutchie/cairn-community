name: Validate registry

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Re-fetch Simple Icons logos referenced by icon.slug so a PR that only
      # adds a connector folder (no committed logo file) still validates.
      - run: node scripts/fetch-logos.mjs
      # Sanitizes icons, validates every connector.json, and fails if
      # manifest.json is out of date with the connectors/ folders.
      - run: node scripts/validate.mjs
